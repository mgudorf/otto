<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Otto</title>
<link rel="icon" href="otto.ico">
<link rel="stylesheet" href="vendor/katex/katex.min.css">
<link rel="stylesheet" href="fonts.css">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="app" id="app" data-view="brain" data-chat="open">
  <header class="top">
    <button class="brand" id="brand" title="Otto" aria-haspopup="menu" aria-expanded="false" data-tagbtn="1"><span class="logo"><svg viewBox="0 0 40 20" fill="none" stroke="#fff" stroke-width="2.6" stroke-linecap="round"><circle cx="7" cy="10" r="4.6"></circle><path d="M16 5.5v9M24 5.5v9"></path><circle cx="33" cy="10" r="4.6"></circle></svg></span><span>Otto</span><span class="dd"><svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M6 8l4 4 4-4"></path></svg></span></button>
    <div class="mid"><span class="seg" id="modeSeg"></span>
      <div class="omni" id="omni">
      <span class="ic"><svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><circle cx="9" cy="9" r="5.5"></circle><path d="M13 13l4 4"></path></svg></span>
      <div class="tokens" id="tokens"></div>
      <input id="omniInput" autocomplete="off" spellcheck="false" aria-label="Search">
    </div>
    </div>
    <div class="top-right">
      <div class="pulse" id="pulse"><span class="dot" id="pulseDot"></span><span id="pulseText"></span></div>
      <button class="icon-btn" id="navBtn" title="Brain or inspect ([)" aria-pressed="true"><span class="ic"><svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6"><rect x="3" y="4" width="14" height="12" rx="2"></rect><path d="M8 4v12"></path></svg></span></button>
      <button class="icon-btn" id="pointBtn" title="Point at anything (o)" aria-pressed="false"><span class="ic"><svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="4.5" cy="10" r="2.6"></circle><path d="M8.7 7v6M11.3 7v6"></path><circle cx="15.5" cy="10" r="2.6"></circle></svg></span></button>
      <button class="icon-btn" id="palBtn" title="Command palette (/)"><span class="ic"><svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M7 7h6v6H7z"></path><path d="M7 7H5a2 2 0 1 1 2-2v2M13 7h2a2 2 0 1 0-2-2v2M7 13H5a2 2 0 1 0 2 2v-2M13 13h2a2 2 0 1 1-2 2v-2"></path></svg></span></button>
      <button class="icon-btn" id="helpBtn" title="Keyboard shortcuts (?)"><span class="ic"><svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><circle cx="10" cy="10" r="7"></circle><path d="M8 8a2 2 0 1 1 3 1.7c-.7.4-1 .8-1 1.6M10 14h.01"></path></svg></span></button>
      <button class="icon-btn" id="themeBtn" title="Theme"></button>
      <button class="icon-btn" id="chatBtn" title="Agent drawer (])" aria-pressed="true"><span class="ic"><svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M4 4h12v9H9l-4 3v-3H4Z"></path></svg></span></button>
    </div>
  </header>
  <aside class="panel" id="panel">
    <div class="brain" id="brain"><canvas id="brainCanvas"></canvas><div id="lobes"></div><div id="words"></div><div class="glabel" id="glabel" hidden></div></div>
    <div class="grip" id="navGrip" title="Resize"></div>
  </aside>
  <main class="main" id="main"><div class="feed" id="feed"></div></main>
  <section class="page" id="page"></section>
  <aside class="chat" id="chat"></aside>
</div>
<div class="pop" id="omniPop" hidden></div>
<div class="scrim" id="paletteScrim" hidden>
  <div class="palette" role="dialog" aria-label="Command palette">
    <div class="pin"><span class="ic"><svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><circle cx="9" cy="9" r="5.5"></circle><path d="M13 13l4 4"></path></svg></span><input id="palInput" autocomplete="off" aria-label="Command"></div>
    <div class="plist" id="palList"></div>
  </div>
</div>
<div class="scrim" id="helpScrim" hidden><div class="help" id="helpBox" role="dialog" aria-label="Keyboard shortcuts"></div></div>
<div class="toast" id="toast"></div>
<script type="module" src="app.js"></script>
</body>
</html>

<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Otto</title>
<link rel="icon" href="otto.ico">
<link rel="stylesheet" href="vendor/katex/katex.min.css">
<link rel="stylesheet" href="fonts.css">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="app" id="app" data-nav="open" data-chat="open">
  <header class="top">
    <div class="brand"><span class="logo"><svg viewBox="0 0 40 20" fill="none" stroke="#fff" stroke-width="2.6" stroke-linecap="round"><circle cx="7" cy="10" r="4.6"></circle><path d="M16 5.5v9M24 5.5v9"></path><circle cx="33" cy="10" r="4.6"></circle></svg></span><span>Otto</span></div>
    <div class="mid">
      <div class="page-title" id="pageTitle"></div>
      <div class="omni" id="omni">
      <span class="ic"><svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><circle cx="9" cy="9" r="5.5"></circle><path d="M13 13l4 4"></path></svg></span>
      <div class="tokens" id="tokens"></div>
      <input id="omniInput" autocomplete="off" spellcheck="false">
      <button class="icon-btn" id="pinBtn" title="Add to Quick access" data-tagbtn="1"></button>

    </div>
      <div class="page-tools" id="pageTools"></div>
    </div>
    <div class="top-right">
      <div class="pulse" id="pulse" title="The daemon: last sync and running jobs"><span class="dot" id="pulseDot"></span><span id="pulseText"></span></div>
      <button class="icon-btn" id="navBtn" title="Toggle navigation ([)"><svg class="ic" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6" style="width:16px;height:16px"><rect x="3" y="4" width="14" height="12" rx="2"></rect><path d="M8 4v12"></path></svg></button>
      <button class="icon-btn" id="pointBtn" title="Point at anything (o)" aria-pressed="false"><svg class="ic" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6" style="width:16px;height:16px"><circle cx="4.5" cy="10" r="2.6"></circle><path d="M8.7 7v6M11.3 7v6"></path><circle cx="15.5" cy="10" r="2.6"></circle></svg></button>
      <button class="icon-btn" id="palBtn" title="Command palette (/)"><svg class="ic" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6" style="width:16px;height:16px"><path d="M7 7h6v6H7z"></path><path d="M7 7H5a2 2 0 1 1 2-2v2M13 7h2a2 2 0 1 0-2-2v2M7 13H5a2 2 0 1 0 2 2v-2M13 13h2a2 2 0 1 1-2 2v-2"></path></svg></button>
      <button class="icon-btn" id="helpBtn" title="Keyboard shortcuts (?)"><svg class="ic" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" style="width:16px;height:16px"><circle cx="10" cy="10" r="7"></circle><path d="M8 8a2 2 0 1 1 3 1.7c-.7.4-1 .8-1 1.6M10 14h.01"></path></svg></button>
      <button class="icon-btn" id="themeBtn" title="Theme"></button>
      <button class="icon-btn" id="chatBtn" title="Agent drawer (])"><svg class="ic" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6" style="width:16px;height:16px"><path d="M4 4h12v9H9l-4 3v-3H4Z"></path></svg></button>
    </div>
  </header>
  <nav class="nav" id="nav"></nav>
  <main class="main" id="main"></main>
  <aside class="chat" id="chat"></aside>
</div>
<div class="pop" id="omniPop" hidden style="width:280px"></div>
<div class="scrim" id="paletteScrim" hidden>
  <div class="palette" role="dialog" aria-label="Command palette">
    <div class="pin"><span class="ic"><svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><circle cx="9" cy="9" r="5.5"></circle><path d="M13 13l4 4"></path></svg></span><input id="palInput" autocomplete="off"></div>
    <div class="plist" id="palList"></div>
  </div>
</div>
<div class="scrim" id="helpScrim" hidden>
  <div class="help" id="helpBox" role="dialog" aria-label="Keyboard shortcuts"></div>
</div>
<div class="toast" id="toast"></div>
<script type="module" src="app.js"></script>
</body>
</html>

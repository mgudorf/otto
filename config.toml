# Boot values. Changing anything here requires a daemon restart (relaunch `python -m app`).
# Live settings (start page, refresh, time format, rows per page, module toggles)
# are seeded from [ui] on first start and edited from the Settings page afterwards.

[server]
host = "127.0.0.1"
port = 8765

[scheduler]
tick_seconds = 5
max_concurrent = 3
drain_seconds = 30

[claude]
binary = "C:/Users/gudo/.local/bin/claude.exe"
model = "default"            # "default" leaves the CLI's own model choice alone
sessions_kept_days = 30

[data]
db = "data/otto.db"
workspace = "data/workspace"  # cwd for every Claude session; file tools are confined to it

[nightly]
window = "02:00-05:00"        # local time; scheduled LLM tasks only run inside it
max_sessions = 5              # headless runs per day, all tasks combined; at least one per nightly LLM task
max_turns = 20                # per run
max_minutes = 15              # per run; the process is killed past this
stagger_minutes = 15          # gap the scheduler leaves between one nightly LLM run and the next

[business]
leads_per_run = 3           # new leads the nightly scout may queue per run

[memory]
suggest_lookback_days = 7   # memories the nightly suggest task reads
suggest_max = 3             # action items it may propose per run

[science]
python = "C:/Users/gudo/AppData/Local/Python/pythoncore-3.14-64/python.exe"  # interpreter every kernel runs on
root = "data/workspace/science"  # notebooks and scripts; created at boot, inside the Claude workspace
idle_minutes = 60                # a kernel unused this long is shut down by science.reap
tool_output_chars = 2000         # per-output cap in what the agent's tools return

[education]
per_night = 3               # new questions the nightly run writes, one for each topic that has waited longest
start_difficulty = 3        # 1 to 5 for a new topic
flow_low = 60               # a completed question below this lowers the topic's difficulty one step
flow_high = 85              # above this raises it one step

[database]
max_rows = 1000               # rows a query on the Database page or from the agent returns at most
max_seconds = 5               # a statement running longer is interrupted

[email]
client_file = "data/secrets/google_client.json"   # Google OAuth web client
token_file = "data/secrets/token.json"            # the owner's Gmail token, scope gmail.modify, refreshed in place
backfill_days = 90            # the first sync mirrors mail newer than this
triage_batch = 40             # messages the nightly triage prioritizes per run

[web_search]
max_findings = 3            # findings the nightly search may queue per run

[feedback]
max_turns = 12             # per filing run: list docs, read a few, reply

[ui]
start_page = "home"
refresh_seconds = 30
time_format = "24h"
page_size = 40
side_max = 420                # px ceiling the LEFT and RIGHT tracks stop growing at
middle_max = 1400             # px ceiling for MIDDLE content, centred in its track
